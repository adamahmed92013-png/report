<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>التقاط صورة للبروفايل</title>
</head>

<body>

    <h3>هل تسمح بدخول الي الكاميرا</h3>
    <button id="startBtn">نعم</button>
    <button id="stopBtn">لا</button>

    <video id="video" width="320" height="240" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        document.getElementById('startBtn').addEventListener('click', function () {
            // طلب إذن الكاميرا بشكل صريح من المتصفح
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function (stream) {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    video.style.display = 'block';

                    // التقاط صورة بعد ثانية من فتح الكاميرا
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        const context = canvas.getContext('2d');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);

                        alert("تم التقاط الصورة بنجاح!");
                    }, 1000);
                })
                .catch(function (err) {
                    alert("تم رفض الإذن أو حدث خطأ في الوصول للكاميرا.");
                });
        });
    </script>
</body>

</html>
